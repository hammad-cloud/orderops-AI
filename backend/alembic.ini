# Schema migrations. The API runs `upgrade head` on startup (app/db/migrate.py);
# from backend/ you can also run: .venv/Scripts/python -m alembic upgrade head
# The database URL comes from app.core.config (backend/.env), not from this file.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
